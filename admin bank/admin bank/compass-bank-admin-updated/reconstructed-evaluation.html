<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evaluation page moved</title><meta http-equiv="refresh" content="0;url=evaluation.html">
<script defer src="compass-ui-label-cleanup.js?v=20261115153707"></script>
</head><body><p>Use the <a href="evaluation.html">single Real-data ML evaluation page</a>.</p>
<script defer src="./compass-admin-remove-notices.js?v=20261115154955"></script>

<script defer src="./compass-admin-remove-two-sections.js?v=20261115155845"></script>

<script defer src="./compass-readable-graphs.js?v=20261115161333"></script>
<script id="compass-sop5-ui-removal-v2">
(function () {
  'use strict';
  if (window.CompassSOP5Removal && window.CompassSOP5Removal.installed) return;

  function normalized(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }
  function headingMatches(el) {
    const t = normalized(el.textContent);
    return (/^SOP\s*5\b/i.test(t) && /anonymous system evaluation/i.test(t)) ||
           /^anonymous system evaluation$/i.test(t);
  }
  function isOtherSopHeading(el) {
    return /^SOP\s*[1-4]\b/i.test(normalized(el.textContent));
  }
  function findOnlySop5Card(heading) {
    let parent = heading.parentElement;
    for (let depth = 0; depth < 9 && parent; depth++, parent = parent.parentElement) {
      if (parent === document.body || parent === document.documentElement) break;
      const headings = Array.from(parent.querySelectorAll('h1,h2,h3,h4,h5,h6'));
      if (headings.some(el => el !== heading && isOtherSopHeading(el))) break;
      const hasEvaluationFields = parent.querySelectorAll('select').length >= 2;
      const hasSubmit = Array.from(parent.querySelectorAll('button,input[type="submit"]'))
        .some(el => /submit anonymous evaluation/i.test(normalized(el.textContent || el.value)));
      if (hasEvaluationFields || hasSubmit) return parent;
    }
    return null;
  }
  function removeSop5Only() {
    let count = 0;
    Array.from(document.querySelectorAll('h1,h2,h3,h4,h5,h6')).forEach(heading => {
      if (!heading.isConnected || !headingMatches(heading)) return;
      const card = findOnlySop5Card(heading);
      if (card) { card.remove(); count++; }
    });
    Array.from(document.querySelectorAll('a,button,li')).forEach(el => {
      if (!el.isConnected) return;
      const t = normalized(el.textContent);
      if (t.length < 100 && /^SOP\s*5\b/i.test(t) && /evaluation/i.test(t)) {
        el.remove(); count++;
      }
    });
    return count;
  }

  let changes = 0;
  function run() { changes += removeSop5Only(); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run, { once: true });
  } else { run(); }
  const observer = new MutationObserver(function (mutations) {
    if (mutations.some(m => m.addedNodes.length > 0)) run();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.CompassSOP5Removal = {
    installed: true,
    run: run,
    get removedCount() { return changes; }
  };
})();
</script>
</body></html>
